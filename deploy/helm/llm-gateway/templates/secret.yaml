{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-gateway.secretName" . }}
  labels: {{- include "llm-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  GATEWAY_API_KEYS: {{ .Values.secrets.GATEWAY_API_KEYS | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.ANTHROPIC_API_KEY | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.OPENAI_API_KEY | quote }}
{{- end }}
