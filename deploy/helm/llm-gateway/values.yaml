# Default values for llm-gateway. Override per environment with -f or --set.

image:
  repository: llm-gateway
  tag: dev
  pullPolicy: IfNotPresent

replicaCount: 2

# Non-secret settings, injected as environment variables through a ConfigMap.
# They fill the ${VAR} placeholders of config/gateway.yaml baked into the image.
env:
  CACHE_MODE: semantic
  OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
  LOG_LEVEL: INFO

# Optional: replace the whole gateway.yaml (models, pricing, limits) without rebuilding the image.
configOverride: ""

# Secrets. Leave empty to create an empty Secret, or point existingSecret to one you manage.
secrets:
  existingSecret: ""
  GATEWAY_API_KEYS: ""   # "team-a:sk-...,team-b:sk-..."; empty = auth disabled
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""

service:
  type: ClusterIP
  port: 80
  nodePort: null         # with type NodePort (e.g. 30080) the host can reach it in kind

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: "1", memory: 512Mi}

autoscaling:
  enabled: false         # needs metrics-server
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

redis:
  enabled: true          # in-cluster Redis for cache + rate limits (no persistence: it is a cache)
  image: redis:7.4-alpine
  maxmemory: 256mb
  url: ""                # set to use an external Redis instead, e.g. redis://my-redis:6379/0

embeddings:
  enabled: true          # CPU embedding server for the semantic cache
  image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
  model: BAAI/bge-small-en-v1.5
  resources:                # measured ~1.3 GiB resident on CPU; 1 GiB got OOMKilled
    requests: {cpu: 250m, memory: 1536Mi}
    limits: {cpu: "2", memory: 2Gi}

metrics:
  serviceMonitor:
    enabled: false       # needs the Prometheus Operator CRDs (kube-prometheus-stack)
    interval: 15s
    labels:
      release: kps       # must match the operator's serviceMonitorSelector
  grafanaDashboard:
    enabled: false       # ConfigMap picked up by the Grafana sidecar of kube-prometheus-stack
