# Local cluster: 1 control plane + 2 workers, each one a Docker container.
# extraPortMappings publish NodePorts on the host (port-forward would pin all
# traffic to a single pod, which defeats load balancing in a load test).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: llm-gateway
nodes:
  - role: control-plane
    extraPortMappings:
      - {containerPort: 30080, hostPort: 8090, listenAddress: "127.0.0.1"}   # gateway
      - {containerPort: 30300, hostPort: 3001, listenAddress: "127.0.0.1"}   # Grafana
      - {containerPort: 30900, hostPort: 9091, listenAddress: "127.0.0.1"}   # Prometheus
  - role: worker
  - role: worker
