[project]
name = "llm-gateway"
version = "0.1.0"
description = "OpenAI-compatible LLM gateway: routing, fallback, caching, rate limits and cost metrics"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
